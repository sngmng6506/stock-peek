name: Update SA stock list

# 사우디 거래소 종목 목록 → data/sa-stocks.json (아랍어 종목명·검색용).
# 커밋되면 data/**가 release.yml 경로에 있어 앱 릴리즈에 포함됨.
on:
  schedule:
    - cron: '0 4 9 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_sa_stocks.py'
      - '.github/workflows/update-sa-stocks.yml'

concurrency:
  group: update-sa-stocks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python scripts/update_sa_stocks.py data/sa-stocks.json

      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          git add data/sa-stocks.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: update SA stock list"
          git pull --rebase origin main
          git push origin HEAD:main
