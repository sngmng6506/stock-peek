name: Check

# 웹사이트 원본(site/)과 생성 결과(website/)가 맞는지, 번역 키가 빠진 곳이 없는지.
# 단위 테스트(tests/)도 여기서. 앱 코드 lint·빌드는 release.yml이 담당.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'website/**'
      - 'scripts/build-site.mjs'
      - 'scripts/check-i18n.mjs'
      - 'src/**'
      - 'tests/**'
      - 'stockpeek-proxy/**'
      - 'server/p4/**'
      - 'scripts/p4-analyze.mjs'
      - 'scripts/check-proxy-sync.mjs'
      - 'package.json'
      - '.github/workflows/check.yml'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run build
      - run: npm test
      - name: Parse PowerShell 5.1-compatible operator scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            'stockpeek-proxy/scripts/smoke-analysis.ps1',
            'stockpeek-proxy/scripts/run-live-test.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - run: node scripts/check-proxy-sync.mjs
      - run: node scripts/check-i18n.mjs
      - run: node scripts/build-site.mjs --check
